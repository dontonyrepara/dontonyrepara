<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>DONTONYREPARA</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #000;
    }

    main {
      position: relative;
      display: grid;
      min-height: 100vh;
      min-height: 100dvh;
      place-items: center;
      overflow: hidden;
    }

    .hero-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .fallback {
      display: none;
      padding: 1.5rem;
      color: #fff;
      font: 1rem/1.5 system-ui, sans-serif;
      text-align: center;
    }

    .fallback.visible {
      display: block;
    }
  </style>
</head>
<body>
  <main>
    <img class="hero-image" src="./Sin%20t%C3%ADtulo.png" alt="DONTONYREPARA">
    <p class="fallback" role="alert">No se pudo cargar la imagen. Comprueba que el archivo “Sin título.png” esté en el repositorio.</p>
  </main>
  <script>
    const image = document.querySelector('.hero-image');
    const fallback = document.querySelector('.fallback');

    image.addEventListener('error', () => {
      image.hidden = true;
      fallback.classList.add('visible');
    });
  </script>
</body>
</html>
